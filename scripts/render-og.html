<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1200px; height: 630px;
    background: radial-gradient(circle at 82% 12%, rgba(255,111,97,0.16), transparent 32%),
                linear-gradient(135deg, rgba(70,240,191,0.14), transparent 45%),
                #070a0c;
    font-family: 'DejaVu Sans', sans-serif;
    color: #edf7f4;
    position: relative;
    overflow: hidden;
  }
  .grid {
    position:absolute; inset:0;
    background-image: linear-gradient(rgba(111,255,210,0.06) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(111,255,210,0.06) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }
  .wrap { position:relative; z-index:2; height:100%; display:flex; align-items:center; padding: 0 74px; gap: 56px; }
  .photo {
    width: 232px; height: 232px; border-radius: 20px; overflow:hidden;
    border: 2px solid rgba(70,240,191,0.55);
    box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .photo img { width:100%; height:100%; object-fit:cover; object-position: center 18%; }
  .eyebrow {
    font-family: 'DejaVu Sans Mono', monospace;
    color: #46f0bf; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px;
  }
  h1 { font-size: 58px; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 16px; font-weight:700;}
  .headline { color:#a9b6b6; font-size: 24px; line-height:1.45; max-width: 640px; margin-bottom: 26px; }
  .terminal {
    display:inline-flex; align-items:center; gap:10px;
    background: rgba(0,0,0,0.45); border: 1px solid rgba(184,220,218,0.22);
    border-radius: 10px; padding: 14px 18px;
    font-family: 'DejaVu Sans Mono', monospace; color:#46f0bf; font-size: 17px;
  }
  .badge-row { display:flex; gap:10px; margin-top:22px; }
  .badge {
    font-family: 'DejaVu Sans Mono', monospace; font-size: 14px; text-transform: uppercase;
    border: 1px solid rgba(184,220,218,0.28); border-radius: 999px; padding: 7px 14px; color:#edf7f4;
    background: rgba(255,255,255,0.03);
  }
  .brand { position:absolute; top:44px; right:60px; display:flex; align-items:center; gap:10px; color:#46f0bf; font-weight:800; font-size:22px; z-index:2; font-family:'DejaVu Sans Mono', monospace;}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="brand">MMK</div>
  <div class="wrap">
    <div class="photo"><img src="PHOTO_SRC" /></div>
    <div>
      <div class="eyebrow">AI Engineering &times; Cybersecurity &times; Automation</div>
      <h1>Muhammad Maaz Kamal</h1>
      <div class="headline">AI Security Engineer building production automation systems &mdash; SOC L3, agentic AI, and RAG platforms shipped to real clients.</div>
      <div class="terminal">wazuh.alert -&gt; enrich.ioc -&gt; llm.triage -&gt; firewall.block</div>
      <div class="badge-row">
        <div class="badge">n8n</div>
        <div class="badge">LangGraph</div>
        <div class="badge">RAG</div>
        <div class="badge">SOC Automation</div>
      </div>
    </div>
  </div>
</body>
</html>
